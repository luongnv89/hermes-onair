name: onair
version: 0.1.0
description: >-
  On Air: free voices and two-host audio shows for Hermes agents. Set
  `tts.provider: onair` to speak with free voices only: OpenRouter's free
  Fish and HeyGen models (price-checked before every call), then edge-tts
  for private use. Each profile speaks as its own persona from a pool of
  10, claimed on first use; `/onair voice` shows it, `/onair voice list`
  lists the pool and `/onair voice set <name>` changes it. `/onair <link or
  text>` and the `onair_episode` agent tool turn a link or text into a
  two-host episode (MP3 plus a WebVTT transcript); its script is written by
  your own configured model through ctx.llm (its cost follows your model
  choice), via the plugin's auxiliary task `onair_script` (reasoning off by
  default; no provider or model override; `auxiliary.onair_script` in
  config.yaml overrides it), or by a built-in template when that fails.
  `/onair standup [profiles]` and the `onair_standup` tool record the Agent
  Standup: each profile listed in the `standup_profiles` setting reports its
  last 24 hours in its own voice. Privacy: only listed profiles are read
  (any other is refused); each one's own state.db is opened read-only, and
  only the titles (and summaries) of sessions from the last 24 hours are
  read, never messages; secret-looking strings are removed before the
  titles reach your model (ctx.llm), the voices or any file. A morning
  standup Automation Blueprint uses free OpenRouter voices only, never
  edge-tts. `hermes onair setup`
  installs the pinned DropCast sidecar that ingests, checks and finishes
  episodes and renders edge-tts.
author: Luong NGUYEN
license: MIT
manifest_version: 2
api_version: 1
kind: standalone
platforms: [linux, macos]
tags: [tts, voice, podcast]
# The host side is stdlib-only. DropCast runs in its own uv venv
# (`hermes onair setup`), so Hermes installs nothing for this plugin.
python_runtime: external
# register() registers the `hermes onair` CLI command, the `/onair` slash
# command (ctx.register_command), the `onair` TTS provider
# (ctx.register_tts_provider), the `onair_episode` and `onair_standup` agent
# tools (ctx.register_tool) and, where Hermes has
# ctx.register_automation_blueprint, the `onair:standup` blueprint. It also
# registers the auxiliary LLM task `onair_script` (ctx.register_auxiliary_task; defaults: reasoning_effort
# none, no provider or model). Hermes has no provides_* key for the CLI
# command, the slash command, the TTS provider or auxiliary tasks.
provides_tools:
  - onair_episode
  - onair_standup
provides_hooks: []
config_schema:
  uv_bin:
    type: str
    default: ""
    description: Path or name of the uv executable; empty looks up uv on PATH.
  sidecar_python:
    type: str
    default: ">=3.11"
    description: Python request passed to `uv venv --python` for the sidecar venv.
  ffmpeg_bin:
    type: str
    default: ""
    description: >-
      Path (with a / or a leading ~) or name on PATH of ffmpeg, used to
      convert HeyGen's raw PCM and to make non-MP3 formats; empty looks on
      PATH, then in Hermes's managed tools ($HERMES_HOME/tools, then
      ~/.hermes/tools: the newest ffmpeg-*/bin/ffmpeg). Without ffmpeg,
      HeyGen is skipped and only MP3 can be made.
  language:
    type: str
    default: auto
    description: >-
      Language of the spoken text (a BCP 47 tag such as en, fr, vi), or auto
      to detect en/fr/vi from the text. English uses Fish, then HeyGen, then
      edge-tts; other languages HeyGen, then Fish, then edge-tts.
  voices:
    type: dict
    default: {}
    description: >-
      Voice overrides per engine and language, e.g.
      {edge: {fr: fr-FR-HenriNeural}, heygen: {"*": tabitha}}; "*" is any
      other language. They win over the profile's persona; unset entries
      use the persona, then the built-in defaults.
  episode_minutes:
    type: float
    default: 1.0
    description: >-
      Target length of an `/onair` episode in minutes (1 to 5), when the
      request names none. The script is capped at about 150 spoken words
      per minute of it.
  keep_episodes:
    type: int
    default: 30
    description: >-
      How many episode folders to keep under the plugin data dir; older ones
      are removed after each new episode. 0 keeps every episode.
  standup_profiles:
    type: list
    default: []
    description: >-
      Profiles the Agent Standup may read (`default` is the root profile),
      e.g. [default, coder, research]. Nothing is read for a profile that is
      not listed: `/onair standup <name>` refuses it. Each listed profile's
      own state.db is opened read-only for the titles of its sessions from
      the last 24 hours.
