<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <!-- On Air catalog card, 1200x600 (2:1). Editable source: text uses DejaVu Sans.
       scripts/render-card.mjs outlines the text into assets/catalog-card.svg and
       renders assets/catalog-card.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1024"/>
      <stop offset="1" stop-color="#221447"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#6b4dff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6b4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3b5c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff3b5c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>

  <!-- the ON AIR sign -->
  <ellipse cx="205" cy="112" rx="170" ry="70" fill="url(#redglow)"/>
  <rect x="80" y="76" width="250" height="72" rx="14" fill="#ff3b5c"/>
  <rect x="86" y="82" width="238" height="60" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="118" cy="112" r="10" fill="#ffffff"/>
  <text x="140" y="126" font-family="DejaVu Sans" font-weight="bold" font-size="36" letter-spacing="4" fill="#ffffff">ON AIR</text>
  <text x="354" y="122" font-family="DejaVu Sans" font-size="24" fill="#9d97c7">for Hermes Agent</text>

  <!-- headline -->
  <text x="80" y="250" font-family="DejaVu Sans" font-weight="bold" font-size="46" fill="#ffffff">Every agent gets</text>
  <text x="80" y="310" font-family="DejaVu Sans" font-weight="bold" font-size="46" fill="#ffffff">a free voice and a show.</text>
  <text x="80" y="370" font-family="DejaVu Sans" font-size="23" fill="#c3bde6">Free OpenRouter voices, price-checked on every call.</text>

  <!-- commands -->
