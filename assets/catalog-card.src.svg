  <text x="104" y="447" font-family="DejaVu Sans Mono" font-weight="bold" font-size="22" fill="#ffb547">/onair &lt;link&gt;</text>
  <text x="320" y="447" font-family="DejaVu Sans" font-size="20" fill="#e8e5ff">a two-host episode</text>
